# i3 settings for the host "larry" (EC2 dev box, reached over xrdp) only.
# Appended to config.base by ~/.bin/i3-build-config.sh; see that script for
# the rules.

# This machine's own wallpaper, a small tile repeated across the screen, in
# place of the shared one. Runs after the shared feh line, so it wins.
exec_always --no-startup-id feh --no-fehbg --bg-tile ~/.config/i3/larry.wallpaper.png
