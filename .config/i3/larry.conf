# i3 settings for the host "larry" (EC2 dev box, reached over xrdp) only.
# Appended to config.base by ~/.bin/i3-build-config.sh; see that script for
# the rules.

# A small tile repeated across the screen, in place of the default wallpaper.
# Runs after the shared feh line, so it wins.
exec_always --no-startup-id feh --no-fehbg --bg-tile ~/.config/i3/wallpapers/tiles.png
