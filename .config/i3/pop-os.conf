# i3 settings for the host "pop-os" (ThinkPad laptop) only. Appended to
# config.base by ~/.bin/i3-build-config.sh; see that script for the rules.

set $term urxvt

# Thinner borders than the shared default; the panel is only 1366x768.
for_window [class=".*"] border pixel 5

bindsym $mod+c exec "firefox"

#bindsym $mod+Mod1+Up exec "/bin/bash ~/.bin/upright.sh"
#bindsym $mod+Mod1+Down exec "/bin/bash ~/.bin/flipped.sh"
bindsym $mod+Shift+s exec "i3lock -i ~/.config/i3/wallpaper.png"
# The rotate button on the ThinkPad bezel.
bindcode 161 exec "thinkpad-rotate"

for_window [class="URxvt" instance="floating"] floating enable
bindsym $mod+m exec urxvt -name floating -e alsamixer

exec xbindkeys
exec "/bin/bash ~/.bin/startupScript.sh"
