   # Prefix: Ctrl+Space instead of Ctrl+B
   unbind C-b
   set -g prefix C-Space
   bind C-Space send-prefix

   # True colour
   set-option -sa terminal-overrides ",xterm*:Tc"

   # Mouse, and number windows/panes from 1
   set -g mouse on
   set -g base-index 1
   set -g pane-base-index 1
   set-window-option -g pane-base-index 1
   set-option -g renumber-windows on

   # Alt+Shift+H / Alt+Shift+L to cycle windows
   bind -n M-H previous-window
   bind -n M-L next-window

   # Vim-style copy mode
   set-window-option -g mode-keys vi
   bind-key -T copy-mode-vi v send-keys -X begin-selection
   bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
   bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

   # New splits open in the current directory
   bind '"' split-window -v -c "#{pane_current_path}"
   bind % split-window -h -c "#{pane_current_path}"

   # Plugins
   set -g @plugin 'tmux-plugins/tpm'
   set -g @plugin 'tmux-plugins/tmux-sensible'
   set -g @plugin 'christoomey/vim-tmux-navigator'
   set -g @plugin 'tmux-plugins/tmux-yank'
   set -g @plugin 'catppuccin/tmux'

   # Show window name (#W, set by prefix+,) instead of pane title (#T) in the status bar
   set -g @catppuccin_window_text " #W"
   set -g @catppuccin_window_current_text " #W"

   # tmux queries the outer terminal on attach (DA1, DA2, OSC 10/11). If a reply
   # arrives split by a gap longer than this, tmux gives up parsing it and every
   # reply leaks into the pane as typed text (e.g. "61;4;6;7;...;52c0;10;1c").
   # Over SSH the gap has exceeded 50ms; lower this if Esc in nvim feels laggy.
   set -sg escape-time 200

   # Keep this at the very bottom
   run '~/.tmux/plugins/tpm/tpm'
